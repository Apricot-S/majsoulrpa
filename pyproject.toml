[project]
name = "majsoulrpa"
version = "0.1.0"
description = "A Robotic Process Automation (RPA) framework for Mahjong Soul (雀魂)"
authors = [
    { name = "Apricot S." },
    { name = "Cryolite", email = "cryolite.indigo@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
readme = "README.md"
requires-python = ">= 3.12"
keywords = ["mahjong", "Mahjong Soul", "Majsoul", "automation", "RPA"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "imapclient>=3.0.1,<4",
    "mitmproxy>=12.2.1,<13",
    "opencv-python>=4.12.0.88,<5",
    "playwright>=1.56.0,<2",
    "protobuf>=6.33.1,<7",
    "jsonschema>=4.25.1,<5",
    "boto3>=1.41.5,<2",
    "pyzmq>=27.1.0,<28",
    "numpy>=2.2.6,<3",
    "wsproto>=1.2.0,<2",
]

[project.scripts]
majsoulrpa_remote_browser = "majsoulrpa.remote_browser._remote_browser:main"

[project.urls]
Repository = "https://github.com/Apricot-S/majsoulrpa.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typing" },
    { include-group = "docs" },
]
lint = [
    "ruff>=0.14.6,<0.15",
]
test = [
    "pytest>=9.0.1,<10",
    "pytest-mock>=3.15.1,<4",
]
typing = [
    "mypy>=1.18.2,<2",
    "types-protobuf>=6.32.1.20251105,<7",
    "types-jsonschema>=4.25.1.20251009,<5",
    "boto3-stubs[s3]>=1.41.5,<2",
]
docs = [
    "sphinx>=8.2.3,<9",
    "sphinx-rtd-theme>=3.0.2,<4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/majsoulrpa"]

[tool.pytest]
minversion = "9.0"
strict = true
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]
extend-exclude = ["src/majsoulrpa/_majsoul_internal/protocol"]
line-length = 79

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C901",    # complex-structure
    "ANN002",  # missing-type-args
    "ANN003",  # missing-type-kwargs
    "TD002",   # missing-todo-author
    "TD003",   # missing-todo-link
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72
ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"./docs/**.py" = ["ALL"]

[tool.ruff.lint.extend-per-file-ignores]
"./examples/*" = [
    "D",      # pydocstyle
    "S101",   # assert
    "INP001", # implicit-namespace-package
    "T201",   # print
    "TRY004", # type-check-without-type-error
]
"./tests/*" = [
    "D",      # pydocstyle
    "S101",   # assert
    "SLF001", # private-member-access
]

[tool.mypy]
exclude = [
    'liqi_pb2\.py$',
    'liqi_pb2\.pyi$',
]
