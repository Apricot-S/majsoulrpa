# All items below are optional.

[majsoulrpa.endpoint]
# IP address where the browser process is running for remote control.
# Defaults to "127.0.0.1".
browser-address = "127.0.0.1"

# IP address where the RPA client is running.
# Defaults to "127.0.0.1".
client-address = "127.0.0.1"

# Port used for remote control of the browser.
# Defaults to 19222.
remote-port = 19222

# Port for handling intercepted traffic between the game server and browser.
# Defaults to 37247.
sniffer-port = 37247

# Browser proxy port used to intercept and route traffic between the game server and browser.
# Defaults to 8080.
proxy-port = 8080

[majsoulrpa.browser]
# Horizontal offset of the browser window at startup.
# The left edge of the primary monitor is 0. Supports multiple monitors.
# Determines the initial launch position, but the window can be moved afterwards.
# Defaults to 0.
window-left = 100

# Vertical offset of the browser window at startup.
# The top edge of the primary monitor is 0. Supports multiple monitors.
# Determines the initial launch position, but the window can be moved afterwards.
# Defaults to 0.
window-top = 100

# Height of the browser viewport in pixels.
# Must be one of 720, 1080, or 1440.
# Defaults to 1080.
viewport-height = 720

# Whether to run the browser headless.
# Defaults to false.
headless = false

# User data directory. If not specified, incognito mode is used.
user-data-dir = "./user-data"

[majsoulrpa.yostar-login.s3]
# Email address where verification emails are sent.
email-address = "your-email@example.com"

# Name of the S3 bucket storing verification emails.
bucket-name = "your-bucket"

# Key prefix under which verification email objects are stored in S3.
key-prefix = "verification-email/"

# AWS CLI profile name used for connecting to S3. Optional.
aws-profile = "default"
