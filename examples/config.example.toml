[[majsoulrpa]]
# Optional. IP address of remote browser. If not specified, desktop mode will be used.
remote_host = "127.0.0.1"

# Optional (the following items are required if set).
[majsoulrpa.authentication]
# Must be 50 characters or less.
email_address = "your_email_address@example.cfg"

# Optional (all items below are also optional).
[majsoulrpa.port]
# Port for browser remote control (default: 19222). Ignored in desktop mode.
remote_port = 19222

# Browser proxy port (default: 8080).
proxy_port = 8080

# Port of the message queue that stores Websocket messages (default: 37247).
message_queue_port = 37247

# Optional (all items below are also optional). Ignored in remote mode.
[majsoulrpa.browser]
# Support multiple monitors.
# The left edge of the primary monitor is 0 (default: 0).
# The top of the primary monitor is 0 (default: 0).
# Either one can be set.
initial_position = { left = 100, top = 100 }

# Support from 720 to 2160 (default: 1080).
viewport_height = 720

# Whether to run the browser headless (default: false).
headless = false

# User data directory (comment out this line to use incognito mode).
user_data_dir = "./user_data"
